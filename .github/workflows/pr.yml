name: Lint and Test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  set-version-tag:
    runs-on: ubuntu-26.04
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.2.0"
      - name: Set SemVer Version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        id: gitversion
        with:
          configFilePath: GitVersion.yml
      - name: Validate stable production SemVer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: scripts/check-release-versioning.sh

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Check immutable CI dependencies
        run: scripts/check-immutable-ci-dependencies.sh
      - name: Check CODEOWNERS coverage
        run: scripts/check-codeowners.sh
      - name: Linters
        run: |
          go run -race cmd/main.go run lint:vuln:scan
      - name: Store Trivy SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif
          path: .eirctl/report.filesystem.sarif
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  trivy-sarif-upload:
    name: Upload Trivy SARIF
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-sarif
          path: reports
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: reports/report.filesystem.sarif
          category: trivy

  quality-sarif:
    name: Analyze Go quality
    runs-on: ubuntu-24.04
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Generate Go quality SARIF
        run: go run cmd/main.go run task go:quality:sarif
      - name: Store Go quality SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-quality-sarif
          path: .eirctl/go-quality.sarif
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  quality-sarif-upload:
    name: Upload Go quality SARIF
    needs: quality-sarif
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-quality-sarif
          path: reports
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: reports/go-quality.sarif
          category: go-quality

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Build and validate documentation
        run: go run cmd/main.go run build:docs
      - name: Upload rendered documentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .eirctl/outputs/docs
          if-no-files-found: warn
          retention-days: 7

  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            docker_host: unix:///var/run/docker.sock
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs:
      - set-version-tag
      - lint
    env:
      SEMVER: ${{ needs.set-version-tag.outputs.semVer }}
      DOCKER_HOST: ${{ matrix.docker_host }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check Schema
        # TODO: Schema Generation is broken on Windows atm
        if: matrix.name == 'Linux'
        run: |
          go run cmd/main.go generate_own_schema
        env:
          CI: true

      - name: Test
        run: |
          go run cmd/main.go run pipeline gha:unit:test

      - name: Upload inert JUnit test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report-${{ matrix.name }}
          path: .coverage/report-junit.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Store Go coverage report
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: .coverage/coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage-upload:
    name: Upload Go coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-coverage
          path: reports
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: reports/coverage.xml
          language: Go
          label: code-coverage/go

  report:
    name: Publish test report
    if: always()
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Download inert JUnit test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: junit-report-*
          path: .coverage
          merge-multiple: true

      - name: Publish JUnit style test report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: ${{ always() && hashFiles('.coverage/report-junit.xml') != '' }}
        with:
          report_paths: ".coverage/report-junit.xml"
          commit: ${{ github.sha }}
          fail_on_failure: true
          check_name: Eirctl Unit Tests
