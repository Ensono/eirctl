name: Publish debug prerelease

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Request debug build workflow run ID
        required: true
        type: string
      pull_request:
        description: Pull request number recorded by trusted finalization
        required: true
        type: string
      commit_sha:
        description: Immutable pull-request head SHA recorded by trusted finalization
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.validate.outputs.artifact_id }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      workflow_run_attempt: ${{ steps.validate.outputs.workflow_run_attempt }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
    steps:
      - name: Validate selected request run, artifact, and PR revision
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            const runId = Number(process.env.BUILD_RUN_ID);
            const pullRequest = Number(process.env.PULL_REQUEST);
            const commitSHA = process.env.COMMIT_SHA;
            const repository = context.repo.owner + '/' + context.repo.repo;
            if (!Number.isSafeInteger(runId) || runId < 1 || !Number.isSafeInteger(pullRequest) || pullRequest < 1 || !/^[0-9a-f]{40}$/i.test(commitSHA)) {
              core.setFailed('A positive workflow run ID, pull request number, and full 40-character commit SHA are required.');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.path !== '.github/workflows/debug-build-request.yml' || run.event !== 'issue_comment' || run.status !== 'completed' || run.conclusion !== 'success' || run.repository?.full_name !== repository || !Number.isSafeInteger(run.run_attempt)) {
              core.setFailed('The selected run is not a successful issue_comment Request debug build run in this repository.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest,
            });
            if (pr.state !== 'open' || pr.base.repo.full_name !== repository || pr.head.sha.toLowerCase() !== commitSHA.toLowerCase()) {
              core.setFailed('The selected pull request is not open at the requested immutable commit SHA.');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const artifactName = `debug-build-${runId}`;
            const matches = artifacts.artifacts.filter(candidate => candidate.name === artifactName && !candidate.expired);
            if (matches.length !== 1 || artifacts.total_count > 100) {
              core.setFailed('The selected request run does not have exactly one unexpired final debug artifact in the bounded result set.');
              return;
            }
            const artifact = matches[0];
            if (artifact.workflow_run?.id !== runId) {
              core.setFailed('The final artifact is not bound to the selected request run.');
              return;
            }
            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('workflow_run_attempt', String(run.run_attempt));
            core.setOutput('tag_name', `debug-pr-${pullRequest}-${commitSHA.slice(0, 12).toLowerCase()}`);

      - name: Download selected artifact for read-only provenance validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.validate.outputs.artifact_id }}
          path: validated-artifact
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify clean-runner provenance before publication
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ steps.validate.outputs.workflow_run_attempt }}
          FINAL_ARTIFACT: ${{ steps.validate.outputs.artifact_name }}
          WORKFLOW_EVENT: issue_comment
          WORKFLOW_PATH: .github/workflows/debug-build-request.yml
        run: |
          test -f validated-artifact/debug-build-provenance.json
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pull_request "$PULL_REQUEST" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg workflow_run_id "$BUILD_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg event "$WORKFLOW_EVENT" \
            --arg workflow_path "$WORKFLOW_PATH" \
            --arg final_artifact "$FINAL_ARTIFACT" \
            '.repository == $repository and .event == $event and .workflow_path == $workflow_path and .pull_request == $pull_request and (.commit_sha | ascii_downcase) == ($commit_sha | ascii_downcase) and .workflow_run_id == $workflow_run_id and .workflow_run_attempt == $workflow_run_attempt and .final_artifact == $final_artifact and .finalized_by == "finalize" and (.intermediate_artifact | test("^debug-build-intermediate-[0-9]+-[0-9]+$")) and (.semver | test("^[0-9]+\\.[0-9]+\\.[0-9]+"))' \
            validated-artifact/debug-build-provenance.json >/dev/null

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-24.04
    environment: debug-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated final artifact as opaque data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate-build.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Recheck provenance on the protected publish runner
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ needs.validate-build.outputs.workflow_run_attempt }}
          FINAL_ARTIFACT: ${{ needs.validate-build.outputs.artifact_name }}
          WORKFLOW_EVENT: issue_comment
          WORKFLOW_PATH: .github/workflows/debug-build-request.yml
        run: |
          test -f release-assets/debug-build-provenance.json
          jq --exit-status \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pull_request "$PULL_REQUEST" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg workflow_run_id "$BUILD_RUN_ID" \
            --arg workflow_run_attempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg event "$WORKFLOW_EVENT" \
            --arg workflow_path "$WORKFLOW_PATH" \
            --arg final_artifact "$FINAL_ARTIFACT" \
            '.repository == $repository and .event == $event and .workflow_path == $workflow_path and .pull_request == $pull_request and (.commit_sha | ascii_downcase) == ($commit_sha | ascii_downcase) and .workflow_run_id == $workflow_run_id and .workflow_run_attempt == $workflow_run_attempt and .final_artifact == $final_artifact and .finalized_by == "finalize" and (.intermediate_artifact | test("^debug-build-intermediate-[0-9]+-[0-9]+$")) and (.semver | test("^[0-9]+\\.[0-9]+\\.[0-9]+"))' \
            release-assets/debug-build-provenance.json >/dev/null

      - name: Publish prerelease assets without executing them
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-build.outputs.tag_name }}
          name: Debug build for PR #${{ inputs.pull_request }} (${{ inputs.commit_sha }})
          prerelease: true
          generate_release_notes: false
          files: |
            release-assets/bin/eirctl-windows-amd64.exe
            release-assets/bin/eirctl-windows-386.exe
            release-assets/bin/eirctl-windows-arm64.exe
            release-assets/bin/eirctl-darwin-amd64
            release-assets/bin/eirctl-darwin-arm64
            release-assets/bin/eirctl-linux-arm64
            release-assets/bin/eirctl-linux-amd64
