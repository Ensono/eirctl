# OpenSSF Scorecard evaluates the repository's supply-chain security posture.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event.repository.default_branch == github.ref_name || github.event_name == 'branch_protection_rule')
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Check out code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
