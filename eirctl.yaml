# yaml-language-server: $schema=schemas/schema_v1.json

debug: false
output: prefixed
# TODO: top level variables are not being munged in
# variables:
#   foo: 1

import:
  - shared/build/go/eirctl.yaml
  - git::ssh://git@github.com/Ensono/eirctl-shared-utils.git//eirctl/utils/eirctl.yaml?ref=fix/initial-lib-import
  - git::ssh://git@github.com/Ensono/eirctl-shared-utils.git//eirctl/security/eirctl.yaml?ref=fix/initial-lib-import

contexts:
  bash:
    container:
      name: mirror.gcr.io/bash:5.0.18-alpine3.22@sha256:943f4381e5c98f3be2f505464cd4b84ec84715251abf30f37476d3865ddcc2ce

  asciidoc:
    container:
      name: docker.io/asciidoctor/docker-asciidoctor:1.106.0@sha256:6266e05784c2d8ece9d9fe5e593b12c3beebebbc467135fd6f4a56269c93cea3
      enable_mount: true

  node24:
    container:
      name: docker.io/node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
      enable_mount: true

pipelines:
  build:binary:
    - task: clean
    - task: build
      depends_on:
        - clean
      variables:
        RepoOwner: Ensono
        BinName: eirctl

  gha:unit:test:
    - pipeline: test:unit
    - task: sonar:coverage:prep
      depends_on:
        - test:unit

  lints:
    - task: go:lint
    - task: go:vuln:check
      variables:
        VulnCheckPost: '| jq ''.statements[] | select(.status == "affected")'''

  build:docs:
    - task: gen:docs:html
    - task: gen:docs:pdf
    - task: gen:docs:validate
      depends_on:
        - gen:docs:html
        - gen:docs:pdf

  build:package:vscode:extension:
    - task: build:vscode:extension
    - task: build:lsp:server
      depends_on:
        - build:vscode:extension
    - task: package:vscode:extension
      depends_on:
        - build:lsp:server

tasks:
  build:vscode:extension:
    description: Builds the VSCode extension
    dir: vscode-extension
    context: node24
    command:
      - |
        npm install
        npm run esbuild:config
        npm run compile

  build:lsp:server:
    description: Builds the LSP server
    context: go1x
    command:
      - |
        go build -o vscode-extension/.bin/eirctl-lsp cmd/eirctl-lsp/main.go
        mkdir -p .deps
        unset GOTOOLCHAIN
        GOPATH=$PWD/.deps GOOS=${BUILD_GOOS} GOARCH=${BUILD_GOARCH} CGO_ENABLED=0 go build \
          -mod=readonly -buildvcs=false \
          -ldflags="-s -w -extldflags -static" \
          -o vscode-extension/.bin/eirctl-lsp${BINARY_SUFFIX} \
          cmd/eirctl-lsp/main.go
    required:
      env:
        - BUILD_GOOS
        - BUILD_GOARCH

  package:vscode:extension:
    description: Publishes the VSCode extension
    dir: vscode-extension
    context: node24
    command:
      - |
        cp -f ../LICENSE .
        node_modules/.bin/vsce package --baseContentUrl https://github.com/Ensono/eirctl/raw/HEAD --baseImagesUrl https://github.com/Ensono/eirctl/raw/HEAD

  gen:docs:html:
    context: asciidoc
    description: Renders docs/index.adoc as HTML beneath .eirctl/outputs/docs.
    command:
      - |
        rm -rf .eirctl/outputs/docs/html
        mkdir -p .eirctl/outputs/docs/html
        asciidoctor --failure-level WARN -b html5 -o .eirctl/outputs/docs/html/index.html docs/index.adoc
        cp -rf docs/svg .eirctl/outputs/docs/html

  gen:docs:pdf:
    context: asciidoc
    description: Renders docs/index.adoc as PDF beneath .eirctl/outputs/docs.
    command:
      - |
        mkdir -p .eirctl/outputs/docs/pdf
        asciidoctor-pdf --failure-level WARN -o .eirctl/outputs/docs/pdf/index.pdf docs/index.adoc

  gen:docs:validate:
    context: node24
    description: Validates the repository-owned rendered-output manifest beneath .eirctl/outputs/docs.
    command:
      - |
        node scripts/validate-docs-output.mjs \
        --manifest scripts/docs-output-manifest.json \
        --output-root .eirctl/outputs/docs

  build:
    context: go1x
    description: Builds Go binary
    command:
      - |
        mkdir -p .deps
        unset GOTOOLCHAIN
        ldflags="-s -w -X \"github.com/{{.RepoOwner}}/{{.BinName}}/cmd/eirctl.Version={{.Version}}\" -X \"github.com/{{.RepoOwner}}/{{.BinName}}/cmd/eirctl.Revision={{.Revision}}\" -extldflags -static"
        echo "--- started building GOOS=${BUILD_GOOS} GOARCH=${BUILD_GOARCH} version of eirctl ---"
        GOPATH=$PWD/.deps GOOS=${BUILD_GOOS} GOARCH=${BUILD_GOARCH} CGO_ENABLED=0 go build -mod=readonly -buildvcs=false -ldflags="$ldflags" -o bin/{{.BinName}}-${BUILD_GOOS}-${BUILD_GOARCH}${BINARY_SUFFIX} cmd/main.go
        echo "--- finished building GOOS=${BUILD_GOOS} GOARCH=${BUILD_GOARCH} version of eirctl ---"
    variations:
      - BUILD_GOOS: windows
        BUILD_GOARCH: amd64
        BINARY_SUFFIX: .exe
      - BUILD_GOOS: windows
        BUILD_GOARCH: "386"
        BINARY_SUFFIX: .exe
      - BUILD_GOOS: windows
        BUILD_GOARCH: arm64
        BINARY_SUFFIX: .exe
      - BUILD_GOOS: darwin
        BUILD_GOARCH: amd64
        BINARY_SUFFIX: ""
      - BUILD_GOOS: darwin
        BUILD_GOARCH: arm64
        BINARY_SUFFIX: ""
      - BUILD_GOOS: linux
        BUILD_GOARCH: arm64
        BINARY_SUFFIX: ""
      - BUILD_GOOS: linux
        BUILD_GOARCH: amd64
        BINARY_SUFFIX: ""
    variables:
      RepoOwner: Ensono
      BinName: eirctl

  build:container:
    description: Builds the docker image
    command: docker build --build-arg Version={{.Version}} --build-arg Revision={{.Revision}} -t eirctl:{{.Version}} .

  goreleaser:
    command:
      - goreleaser --debug --rm-dist

  gofmt:
    context: go1x
    command:
      - |
        unset GOTOOLCHAIN
        go fmt ./...
        gofmt -l **/*.go

  schema_gen_deps:
    description: |
      Installing dependencies for the struct type generation
    command:
      - pnpm install -g quicktype

  generate_own_schema:
    description: |
      Generates the schema for a eirctl itself.

      Exits in CI if changes detected.
    command:
      - go run tools/schemagenerator/main.go 2>&1
      - |
        # cat schemas/schema_v1.json
        git status --porcelain --untracked-files=no
        if [ ! -z "$(git status --porcelain --untracked-files=no)" ]; then
          if [ ! -z ${CI+x} ] ; then
            echo "In CI with an unclean tree - exiting"
            echo "Info: make sure you have generatedschema locally and committed"
            exit 1
          fi
        fi

  generate_ci_structs_from_schema:
    description: |
      Type generation for target CI definitions used by the generate command
      CI Definitions will be used by generate-def command.
    command:
      - mkdir -p ./internal/z_generated/github
      - quicktype --lang go --src-lang schema --src ./internal/schema/sources/sources/github.json -o internal/z_generated/github/schema.go --field-tags yaml \
        --just-types-and-package --omit-empty --package githubworkflow &2>1
      - go fmt ./internal/z_generated/github
      - mkdir -p ./internal/z_generated/gitlab
      - quicktype --lang go --src-lang schema --src ./internal/schema/sources/sources/gitlab.json -o internal/z_generated/gitlab/schema.go --field-tags yaml \
        --just-types-and-package --omit-empty --package gitlab &2>1
      - go fmt ./internal/z_generated/gitlab
      - quicktype --lang go --src-lang schema --src ./internal/schema/sources/bitbucket.json -o internal/schema/bitbucket.go --field-tags yaml --just-types-and-package --omit-empty --package schema
      - go fmt internal/schema/bitbucket.go

  show_docs:
    command:
      - go install golang.org/x/tools/cmd/godoc@latest
      - open http://localhost:6060/pkg/github.com/Ensono/eirctl/?m=all
      - godoc -notes "BUG|TODO" -play -http=:6060

  tidy:
    name: "tidy me up"
    context: go1x
    command:
      - go mod tidy

  sonar:coverage:prep:
    context: bash
    command:
      - |
        # SonarCloud expects relative file paths, but Go generates coverage with full module paths
        # Convert from 'github.com/Ensono/eirctl/path/file.go' to 'path/file.go'
        sed -i 's|github.com/Ensono/eirctl/||g' .coverage/out
        echo "Coverage file first 20 lines after conversion:"
        head -20 .coverage/out
        echo "Coverage file line count:"
        wc -l .coverage/out
