name: Trusted Go vulnerability report

# Publication of Go vulnerability findings to GitHub code scanning is isolated
# from the job that executes pull-request-controlled content. The "Lint and Test"
# workflow runs the scan with contents: read only and publishes an unprivileged
# artifact; this protected-default-branch workflow treats that artifact as
# untrusted data, verifies its provenance, and is the only holder of
# security-events: write for pull-request revisions.
on:
  workflow_run:
    workflows: [Lint and Test]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Trusted Go vulnerability report
    # An unrelated lint failure must not discard a completed scan, so a failed
    # upstream conclusion is still eligible. Scan completion is proven by the
    # verified artifact, which the upstream job publishes only after its own
    # validation succeeds.
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    concurrency:
      # GitHub can omit pull_requests for fork runs. Use the PR number when it is
      # present and a stable fork-repository/branch identity otherwise so newer
      # revisions cancel stale reports without colliding with unrelated forks.
      group: govulncheck-sarif-${{ github.event.workflow_run.pull_requests[0].number || format('{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) }}
      cancel-in-progress: true
    steps:
      # This validator comes only from protected main. Pull-request source is
      # never passed to checkout, git, an archive extractor, or another action.
      - name: Check out trusted report validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            scripts/validate-govulncheck-sarif.sh
          sparse-checkout-cone-mode: false

      - name: Resolve immutable upstream provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          readonly expected_workflow='Lint and Test'
          readonly expected_branch='main'
          readonly expected_artifact="govulncheck-sarif-${RUN_ID}-${RUN_ATTEMPT}"
          readonly repository="$GITHUB_REPOSITORY"

          run="$(gh api "repos/${repository}/actions/runs/${RUN_ID}")"
          jq -e \
            --arg repository "$repository" \
            --arg workflow "$expected_workflow" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            '.id == $run_id and .run_attempt == $run_attempt and .name == $workflow and
             (.event == "pull_request" or .event == "push") and
             .repository.full_name == $repository and
             (.head_sha | test("^[0-9a-f]{40}$")) and
             (.head_repository.full_name | type == "string" and length > 0) and
             (.head_repository.owner.login | type == "string" and length > 0) and
             (.head_branch | type == "string" and length > 0) and
             (.pull_requests | type == "array" and (length == 0 or length == 1))' <<<"$run" >/dev/null

          event="$(jq -er '.event' <<<"$run")"
          head_sha="$(jq -er '.head_sha' <<<"$run")"
          run_head_repository="$(jq -er '.head_repository.full_name' <<<"$run")"
          head_owner="$(jq -er '.head_repository.owner.login' <<<"$run")"
          head_ref="$(jq -er '.head_branch' <<<"$run")"

          if [[ "$event" == "push" ]]; then
            # Protected-branch pushes are attributed to the branch itself. The
            # workflow-level condition already required the trusted repository
            # and branch; re-derive both from immutable API data here.
            [[ "$run_head_repository" == "$repository" && "$head_ref" == "$expected_branch" ]] ||
              { echo 'push run is not a trusted protected-branch revision' >&2; exit 1; }
            upload_ref="refs/heads/${expected_branch}"
          else
            associated_pr_count="$(jq -er '.pull_requests | length' <<<"$run")"
            if (( associated_pr_count == 1 )); then
              pr_number="$(jq -er '.pull_requests[0].number | select(type == "number" and . > 0)' <<<"$run")"
            else
              candidates="$(gh api --method GET "repos/${repository}/pulls" \
                -f state=open \
                -f base="$expected_branch" \
                -f head="${head_owner}:${head_ref}" \
                -f per_page=2)"
              pr_number="$(jq -er \
                --arg repository "$repository" \
                --arg branch "$expected_branch" \
                --arg head_repository "$run_head_repository" \
                --arg head_ref "$head_ref" \
                --arg sha "$head_sha" \
                'if length != 1 then
                   error("expected exactly one open pull request for verified workflow run head")
                 elif (.[0].state != "open" or
                       .[0].base.repo.full_name != $repository or .[0].base.ref != $branch or
                       .[0].head.repo.full_name != $head_repository or .[0].head.ref != $head_ref or
                       .[0].head.sha != $sha) then
                   error("pull request candidate does not match verified workflow run head")
                 else
                   .[0].number | select(type == "number" and . > 0)
                 end' <<<"$candidates")"
            fi

            pull_request="$(gh api "repos/${repository}/pulls/${pr_number}")"
            jq -e \
              --arg repository "$repository" \
              --arg branch "$expected_branch" \
              --arg head_repository "$run_head_repository" \
              --arg head_ref "$head_ref" \
              --arg sha "$head_sha" \
              --argjson pr_number "$pr_number" \
              '.number == $pr_number and .state == "open" and
               .base.repo.full_name == $repository and .base.ref == $branch and
               .head.repo.full_name == $head_repository and .head.ref == $head_ref and
               .head.sha == $sha' <<<"$pull_request" >/dev/null

            # refs/pull/<n>/head exists in this repository for fork pull requests
            # as well, and its tip is the scanned head revision, so code scanning
            # attaches the report to the originating pull request.
            upload_ref="refs/pull/${pr_number}/head"
          fi

          artifacts="$(gh api "repos/${repository}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "$expected_artifact" --arg sha "$head_sha" --argjson run_id "$RUN_ID" \
            '[.artifacts[] | select(.name == $name and .expired == false and
              .workflow_run.id == $run_id and .workflow_run.head_sha == $sha)] |
             if length == 1 then .[0].id else error("expected exactly one current Go vulnerability SARIF artifact") end' \
            <<<"$artifacts")"

          {
            printf 'artifact-id=%s\n' "$artifact_id"
            printf 'head-repository=%s\n' "$run_head_repository"
            printf 'head-sha=%s\n' "$head_sha"
            printf 'run-id=%s\n' "$RUN_ID"
            printf 'upload-ref=%s\n' "$upload_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Download only the verified Go vulnerability SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact-id }}
          path: report
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate bounded passive SARIF artifact
        run: trusted/scripts/validate-govulncheck-sarif.sh report

      # github/codeql-action/upload-sarif derives commit_oid from `git rev-parse
      # HEAD` inside checkout_path and only falls back to the `sha` input when no
      # Git worktree is reachable from there (github/codeql-action#2807). The
      # report directory is deliberately outside any worktree, which the
      # validator asserts, so the verified head SHA is what gets reported.
      - name: Publish verified SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: report/govulncheck.sarif
          checkout_path: ${{ github.workspace }}/report
          ref: ${{ steps.provenance.outputs.upload-ref }}
          sha: ${{ steps.provenance.outputs.head-sha }}
          category: govulncheck
          wait-for-processing: "true"
